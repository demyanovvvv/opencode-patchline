name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
        node: [22.x]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install OpenCode CLI
        run: npm install --global opencode-ai@1.18.30
      - run: opencode --version
      - run: npm run typecheck
      - run: npm test -- --run --testTimeout=30000
      - run: npm run lint
      - run: npm run build
      - run: npm run doctor
      - run: npm run bench
      - run: npm run smoke:plugin
      - run: npm run smoke:package
      - run: npm audit --audit-level=high
      - run: npm pack --dry-run
