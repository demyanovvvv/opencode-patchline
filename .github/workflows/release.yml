name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: npm ci
      - run: node scripts/check-release.mjs "$GITHUB_REF_NAME"
      - run: npm install --global opencode-ai@1.18.35
      - run: opencode --version
      - run: npm run typecheck
      - run: npm test -- --run --testTimeout=30000
      - run: npm run test:coverage
      - run: npm run lint
      - run: npm run build
      - run: npm run doctor
      - run: npm run bench
      - run: npm run smoke:plugin
      - run: npm run smoke:package
      - run: bun --conditions=browser scripts/hashline-smoke.mjs
      - run: bun --conditions=browser scripts/hashline-differential.mjs
      - run: bun --conditions=browser scripts/tui-smoke.mjs
      - run: npm run smoke:install
      - run: npm run smoke:installer-lifecycle
      - run: npm run smoke:installer-lsp
      - run: npm run audit:dependencies
      - run: npm audit --audit-level=high
      - run: npm pack --dry-run
      - name: Package release archive
        run: |
          npm pack --ignore-scripts
          sha256sum "opencode-patchline-${GITHUB_REF_NAME#v}.tgz" > SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "opencode-patchline-${GITHUB_REF_NAME#v}.tgz" SHA256SUMS.txt \
            --verify-tag --title "Patchline ${GITHUB_REF_NAME#v}" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
